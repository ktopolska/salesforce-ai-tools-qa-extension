name: SF Ticket to PR

run-name: "Ticket #${{ github.event.issue.number || github.event.pull_request.number }}: ${{ github.event.issue.title || github.event.pull_request.title }}"

# Mention-driven AI workflow. Fires when an Aquiva collaborator (or higher)
# writes "@butler" in an issue body, issue comment, PR review, or PR review
# comment. The agent reads the full thread itself and decides what to do —
# work the ticket, ask for clarification, propose a split, or refuse. There
# is no label state machine; every fire is independent and re-reads the
# conversation from scratch.
#
# Cost protection: events from anyone whose author_association isn't OWNER,
# MEMBER, or COLLABORATOR are silently ignored. That replaces the old
# "delegate-to-ai label" gate without leaving an open-source DoS surface.
# Bot-authored events are also dropped so the agent can't summon itself.
#
# The only label still in use is `ai-involved`, applied by the agent when it
# opens a PR. It's purely informational — humans can filter the PR list by it.

on:
  workflow_call:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

jobs:
  # Cheap first pass: read the thread, decide whether to proceed. Posts
  # whatever comment the agent thinks is appropriate (plan, clarifying
  # question, split proposal, refusal). Outputs proceed=true only when the
  # agent has committed to doing the work in the same run.
  triage:
    name: triage
    # Author-association strings live in event-specific paths; flatten them
    # here. The contains() checks both gate access AND filter out events
    # without an @butler mention so we don't burn Claude credits on noise.
    if: |
      (
        (github.event_name == 'issues' &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) &&
         contains(github.event.issue.body, '@butler') &&
         github.event.issue.user.type != 'Bot') ||
        (github.event_name == 'issue_comment' &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
         contains(github.event.comment.body, '@butler') &&
         github.event.comment.user.type != 'Bot') ||
        (github.event_name == 'pull_request_review' &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association) &&
         contains(github.event.review.body, '@butler') &&
         github.event.review.user.type != 'Bot') ||
        (github.event_name == 'pull_request_review_comment' &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
         contains(github.event.comment.body, '@butler') &&
         github.event.comment.user.type != 'Bot')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      proceed: ${{ steps.outcome.outputs.proceed }}
      kind: ${{ steps.context.outputs.kind }}
      number: ${{ steps.context.outputs.number }}
      pr_branch: ${{ steps.context.outputs.pr_branch }}
      scratch_key: ${{ steps.context.outputs.scratch_key }}
      plan: ${{ steps.outcome.outputs.plan }}
    steps:
      - uses: actions/checkout@v6

      - name: Checkout salesforce-ai-tools (skills + scripts)
        uses: actions/checkout@v6
        with:
          repository: ktopolska/salesforce-ai-tools-public
          path: .sf-ai-tools

      - name: Install skills and rules globally
        run: bash scripts/install-sf-ai-tools.sh

      # Normalize the event into a few simple variables: is this an issue or a
      # PR? what's the number? if it's a PR, what's the head branch? The agent
      # and the execute job both want this without re-deriving it from each
      # event shape.
      - name: Resolve context
        id: context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            NUMBER="${{ github.event.pull_request.number }}"
            KIND=pr
          elif [ -n "${{ github.event.issue.pull_request.url }}" ]; then
            NUMBER="${{ github.event.issue.number }}"
            KIND=pr
          else
            NUMBER="${{ github.event.issue.number }}"
            KIND=issue
          fi
          PR_BRANCH=""
          # Scratch-org alias must be stable across issue runs and PR follow-ups so
          # the same per-PR org is reused. For PR events, resolve the linked issue
          # number from `Closes #N` / `Fixes #N` / `Resolves #N` in the PR body and
          # use that as the key. Falls back to the event number if no link exists.
          SCRATCH_KEY="$NUMBER"
          if [ "$KIND" = "pr" ]; then
            PR_DATA=$(gh pr view "$NUMBER" --repo ${{ github.repository }} --json headRefName,body)
            PR_BRANCH=$(echo "$PR_DATA" | jq -r '.headRefName')
            PR_BODY=$(echo "$PR_DATA" | jq -r '.body')
            LINKED=$(echo "$PR_BODY" | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' | grep -oE '[0-9]+' | head -n 1 || true)
            if [ -n "$LINKED" ]; then
              SCRATCH_KEY="$LINKED"
            fi
          fi
          echo "kind=$KIND" >> $GITHUB_OUTPUT
          echo "number=$NUMBER" >> $GITHUB_OUTPUT
          echo "pr_branch=$PR_BRANCH" >> $GITHUB_OUTPUT
          echo "scratch_key=$SCRATCH_KEY" >> $GITHUB_OUTPUT
          echo "::notice::context kind=$KIND number=$NUMBER scratch_key=$SCRATCH_KEY branch=$PR_BRANCH"

      - name: Decide
        uses: anthropics/claude-code-action@v1
        id: claude
        with:
          prompt: |
            Read ~/.claude/skills/sf-ticket-to-pr/SKILL.md for instructions.

            You were summoned by an @butler mention on ${{ steps.context.outputs.kind }} #${{ steps.context.outputs.number }} of ${{ github.repository }}.

            **Before anything else, run this command and read the full output:**

                gh ${{ steps.context.outputs.kind == 'pr' && 'pr' || 'issue' }} view ${{ steps.context.outputs.number }} --repo ${{ github.repository }} --comments

            The @butler mention that triggered this run is likely a short comment
            like "@butler" or "@butler retry" — that is NOT the task. The actual
            task is in the **issue body** (the first block of text in the output
            above, before any comments). Do not confuse a triggering comment with
            the issue description.

            Execute ONLY the triage decision — based on what you read above, pick
            one of: take it, ask for clarification, propose a split, or refuse.

            **You MUST post your decision as a real GitHub comment by running
            the shell command below.** Emitting the comment text in your
            response does NOT post it; nothing is visible to humans or to the
            execute job unless you actually call `gh`:

                cat > /tmp/butler-reply.md <<'EOF'
                <your comment body here>
                EOF
                gh ${{ steps.context.outputs.kind == 'pr' && 'pr' || 'issue' }} comment ${{ steps.context.outputs.number }} --repo ${{ github.repository }} --body-file /tmp/butler-reply.md

            If — and only if — you are taking the work in this run, end the
            file content with a single trailing line containing exactly:

                <!-- butler:proceed -->

            That HTML-comment marker is how the execute job decides to fire.
            Do not include it for clarifications, splits, or refusals.

            **Retry shortcut.** If you are proceeding AND your plan is the
            same as the most recent prior triage comment of yours on this
            thread (i.e. the human just re-pinged @butler to retry without
            changing the ask), skip the summary — write the comment body as
            just the single line `<!-- butler:proceed -->`. The mention
            already said what's wanted; don't echo it back as "Retrying with
            the same plan." Only write a real summary when the plan is new
            or has materially changed.

            STOP after posting the comment — there is no Salesforce CLI or
            scratch org available here; the execute job runs next and depends
            on whether you set the proceed marker.

            Tone: strong opinions, no "Great question!" or "I'd be happy to
            help!", brevity mandatory, no emojis, call things out if the
            request is unclear or risky.
          claude_args: "--max-turns 30 --model claude-sonnet-4-6"
          show_full_output: "true"
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Detect the "proceed" marker by scanning the last bot comment posted on
      # the issue or PR. The marker is an HTML comment so it renders invisibly
      # in GitHub but is trivially greppable here.
      - name: Determine outcome
        id: outcome
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ steps.context.outputs.number }}
        run: |
          LAST=$(gh api "/repos/${{ github.repository }}/issues/$NUMBER/comments" --jq 'map(select(.user.type == "Bot")) | last.body')
          if echo "$LAST" | grep -q 'butler:proceed'; then
            echo "::notice::Triage outcome: proceed — execute job will run."
            echo "proceed=true" >> $GITHUB_OUTPUT
            { echo "plan<<EOF_PLAN"; echo "$LAST"; echo "EOF_PLAN"; } >> $GITHUB_OUTPUT
          else
            echo "::notice::Triage outcome: stop — execute job will be skipped."
            echo "proceed=false" >> $GITHUB_OUTPUT
          fi

      - name: Report AI cost
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.context.outputs.scratch_key }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: .sf-ai-tools/.github/scripts/report-ai-cost.sh || echo "::warning::cost report failed"

      # Mark the issue/PR with `ai-involved` so humans see at a glance that
      # Butler touched this thread. Purely visual — never gates anything.
      - name: Stamp ai-involved label
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ steps.context.outputs.number }}
          KIND: ${{ steps.context.outputs.kind }}
        run: |
          if [ "$KIND" = "pr" ]; then
            gh pr edit "$NUMBER" --repo ${{ github.repository }} --add-label ai-involved || true
          else
            gh issue edit "$NUMBER" --repo ${{ github.repository }} --add-label ai-involved || true
          fi

      - name: Notify on triage failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ steps.context.outputs.number }}
          KIND: ${{ steps.context.outputs.kind }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$KIND" = "pr" ]; then
            gh pr comment "$NUMBER" --repo ${{ github.repository }} --body "Triage failed before I could decide. See the [run logs]($RUN_URL). Mention me again to retry."
          else
            gh issue comment "$NUMBER" --repo ${{ github.repository }} --body "Triage failed before I could decide. See the [run logs]($RUN_URL). Mention me again to retry."
          fi

  execute:
    name: execute
    needs: triage
    if: needs.triage.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    # Serialize runs that target the same scratch org so two mentions don't
    # race. scratch_key is the issue number (resolved from `Closes #N` on PR
    # events) — the alias `pr-<issue-number>` stays stable across the issue
    # run and every PR follow-up.
    concurrency:
      group: scratch-org-${{ needs.triage.outputs.scratch_key }}
      cancel-in-progress: false
    env:
      DEV_HUB_URL: set
      KIND: ${{ needs.triage.outputs.kind }}
      NUMBER: ${{ needs.triage.outputs.number }}
      PR_BRANCH: ${{ needs.triage.outputs.pr_branch }}
      SCRATCH_ORG_ALIAS: pr-${{ needs.triage.outputs.scratch_key }}
      ISSUE_NUMBER: ${{ needs.triage.outputs.scratch_key }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # Issue path: branch off main. PR path: check out the PR's head branch.
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.triage.outputs.kind == 'pr' && needs.triage.outputs.pr_branch || '' }}

      - name: Checkout salesforce-ai-tools (skills + scripts)
        uses: actions/checkout@v6
        with:
          repository: ktopolska/salesforce-ai-tools-public
          path: .sf-ai-tools

      - name: Install skills and rules globally
        run: bash scripts/install-sf-ai-tools.sh

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create branch for new issue
        if: needs.triage.outputs.kind == 'issue'
        run: git checkout -b "fix/issue-${{ needs.triage.outputs.number }}"

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      # Chromium for Playwright-driven UI verification. The agent only fires
      # it up for user-visible changes (see playwright-sf skill); install is
      # unconditional so the binary is always available when the model decides
      # to use it.
      - name: Install Playwright Chromium
        run: npx --yes playwright install --with-deps chromium

      - name: Authenticate DevHub
        run: sf org login sfdx-url --set-default-dev-hub --sfdx-url-stdin <<< "${{ secrets.SFDX_AUTH_URL }}"

      # Cached per-PR scratch org auth. Cache hit → create-scratch-org.sh
      # re-logs in and skips provisioning. Cache miss → full provision.
      - name: Restore scratch org auth from cache
        uses: actions/cache@v5
        with:
          path: /tmp/sfdx-auth-${{ env.SCRATCH_ORG_ALIAS }}.url
          key: scratch-auth-${{ env.SCRATCH_ORG_ALIAS }}

      - name: Provision or restore scratch org
        run: HEADLESS=true ./scripts/create-scratch-org.sh

      # ─── QA SCENARIO GENERATION ──────────────────────────────────────
      # Generate abstract test scenarios BEFORE dev so the dev agent
      # knows what QA will verify. Failure does not block dev work.
      - name: Generate QA scenarios
        uses: anthropics/claude-code-action@v1
        id: claude-qa-scenarios
        continue-on-error: true
        with:
          prompt: |
            Read ~/.claude/skills/qa-plan/SKILL.md for instructions.

            Generate abstract test scenarios for issue #${{ env.NUMBER }} in ${{ github.repository }}.

            The triage plan (what the dev agent committed to):

            --- Plan ---
            ${{ needs.triage.outputs.plan }}
            --- End plan ---
          claude_args: "--max-turns 15 --model claude-sonnet-4-6"
          additional_permissions: "Bash(git*)"
          show_full_output: "true"
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Report QA scenarios AI cost
        if: steps.claude-qa-scenarios.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ needs.triage.outputs.scratch_key }}
          EXECUTION_FILE: ${{ steps.claude-qa-scenarios.outputs.execution_file }}
        run: .sf-ai-tools/.github/scripts/report-ai-cost.sh || echo "::warning::cost report failed"

      - name: Do the work
        uses: anthropics/claude-code-action@v1
        id: claude-dev
        with:
          prompt: |
            Read ~/.claude/skills/sf-ticket-to-pr/SKILL.md for instructions.

            You were summoned by an @butler mention on ${{ env.KIND }} #${{ env.NUMBER }}. Triage has already decided you are taking the work in this run; the proceed marker is set. Skip the triage decision and go straight to coding, verifying, and shipping.

            Your earlier triage comment (the plan you committed to):

            --- Plan ---
            ${{ needs.triage.outputs.plan }}
            --- End plan ---

            Read the full thread for context (`gh ${{ env.KIND == 'pr' && 'pr' || 'issue' }} view ${{ env.NUMBER }} --repo ${{ github.repository }} --comments`).

            QA scenarios (what will be independently verified — build your solution to handle these):
            If the file /tmp/test-scenarios.md exists, read it. These are the test scenarios
            that will be run against your implementation after you finish. Do not modify this file.
            Use these scenarios to inform your implementation — make sure your solution handles
            the cases described, especially negative cases and boundary conditions.
            If the file does not exist, proceed normally with just the plan above.

            Tone for human-facing text: strong opinions, no "Great question!" or "I'd be happy to help!", brevity mandatory, no emojis, call out anything unclear or risky.
          claude_args: "--max-turns 90 --model claude-sonnet-4-6"
          show_full_output: "true"
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Report dev AI cost
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ needs.triage.outputs.scratch_key }}
          EXECUTION_FILE: ${{ steps.claude-dev.outputs.execution_file }}
        run: .sf-ai-tools/.github/scripts/report-ai-cost.sh || echo "::warning::cost report failed"

      # ─── QA TRACK (inline) ───────────────────────────────────────────
      # After dev work completes, query org metadata, materialize
      # abstract scenarios into concrete checks, run them, fix failures,
      # then post an independent QA verdict.

      - name: Query org metadata for QA
        id: org-metadata
        if: steps.claude-dev.outcome == 'success'
        env:
          TRIAGE_PLAN: ${{ needs.triage.outputs.plan }}
        run: |
          KNOWN_OBJECTS="Account Contact Lead Opportunity Case Task Event User Order Product PricebookEntry Quote Contract Campaign CampaignMember Asset WorkOrder ServiceAppointment LiveChatTranscript MessagingSession"
          FOUND_OBJECTS=""
          for obj in $KNOWN_OBJECTS; do
            if echo "$TRIAGE_PLAN" | grep -qiw "$obj"; then
              FOUND_OBJECTS="$FOUND_OBJECTS $obj"
            fi
          done
          if [ -f /tmp/test-scenarios.md ]; then
            for obj in $KNOWN_OBJECTS; do
              if grep -qiw "$obj" /tmp/test-scenarios.md; then
                FOUND_OBJECTS="$FOUND_OBJECTS $obj"
              fi
            done
          fi
          CUSTOM_OBJECTS=$(echo "$TRIAGE_PLAN" | grep -oE '[A-Za-z_]+__c' | sort -u | tr '\n' ' ')
          if [ -f /tmp/test-scenarios.md ]; then
            CUSTOM_OBJECTS="$CUSTOM_OBJECTS $(grep -oE '[A-Za-z_]+__c' /tmp/test-scenarios.md | sort -u | tr '\n' ' ')"
          fi
          FOUND_OBJECTS=$(echo "$FOUND_OBJECTS $CUSTOM_OBJECTS" | tr ' ' '\n' | sort -u | tr '\n' ' ' | xargs)

          if [ -z "$FOUND_OBJECTS" ]; then
            echo "::notice::No Salesforce objects found in triage plan or scenarios — skipping metadata query"
            > /tmp/org-metadata.txt
            exit 0
          fi

          echo "::notice::Querying metadata for: $FOUND_OBJECTS"
          > /tmp/org-metadata.txt
          for obj in $FOUND_OBJECTS; do
            FIELDS=$(sf sobject describe "$obj" --target-org "$SCRATCH_ORG_ALIAS" --json 2>/dev/null \
              | jq -c '[.result.fields[] | {name: .name, type: .type, label: .label, picklistValues: [.picklistValues[]? | select(.active) | .value]}]' 2>/dev/null \
              || echo '[]')
            echo "## $obj" >> /tmp/org-metadata.txt
            echo "$FIELDS" >> /tmp/org-metadata.txt
          done
          echo "::notice::Org metadata written to /tmp/org-metadata.txt"

      - name: Pre-install Playwright for QA scripts
        if: steps.claude-dev.outcome == 'success'
        run: npm install --no-save playwright

      - name: Generate frontdoor URL
        id: frontdoor
        if: steps.claude-dev.outcome == 'success'
        run: |
          INSTANCE_URL=$(sf org display --target-org "${{ env.SCRATCH_ORG_ALIAS }}" --json | jq -r '.result.instanceUrl')
          URL=$(sf org open --url-only --target-org "${{ env.SCRATCH_ORG_ALIAS }}" --json | jq -r '.result.url')
          if [ -n "$URL" ] && [ "$URL" != "null" ]; then
            echo "url=$URL" >> $GITHUB_OUTPUT
            echo "instance-url=$INSTANCE_URL" >> $GITHUB_OUTPUT
            echo "::notice::Frontdoor URL generated for E2E tests"
          else
            echo "url=" >> $GITHUB_OUTPUT
            echo "instance-url=" >> $GITHUB_OUTPUT
            echo "::warning::Could not generate frontdoor URL — E2E tests will be skipped"
          fi

      - name: Dev self-check and fix
        if: steps.claude-dev.outcome == 'success'
        uses: anthropics/claude-code-action@v1
        id: claude-qa-fix
        continue-on-error: true
        with:
          prompt: |
            Read ~/.claude/skills/qa-run/SKILL.md for instructions.

            Materialize and run QA checks for issue #${{ env.NUMBER }} in ${{ github.repository }}.

            Abstract test scenarios: /tmp/test-scenarios.md
            Org metadata: /tmp/org-metadata.txt
            Scratch org alias: ${{ env.SCRATCH_ORG_ALIAS }}
            Frontdoor URL: ${{ steps.frontdoor.outputs.url }}
            Instance URL: ${{ steps.frontdoor.outputs.instance-url }}

            1. Read the abstract scenarios and org metadata files.
            2. Materialize each abstract scenario into a concrete check — SOQL/data for data scenarios, Playwright E2E for UI scenarios.
            3. Run Phase 1 (data checks) first, then Phase 2 (E2E) if <50% of data tests failed.
            4. For any check that fails with a code-level issue: fix the source code, re-deploy, and re-run the check ONCE. If it still fails, record as "unresolved" and move on.
            5. Write results incrementally to /tmp/qa-results.json.

            Before running E2E, export these:
            export FRONTDOOR_URL="${{ steps.frontdoor.outputs.url }}"
            export INSTANCE_URL="${{ steps.frontdoor.outputs.instance-url }}"

            Do NOT post any report — a separate step handles evaluation.
          claude_args: "--max-turns 55 --model claude-sonnet-4-6"
          additional_permissions: "Bash(git*),Bash(sf*),Bash(cp*),Bash(mkdir*),Bash(node*),Bash(npm*),Bash(npx*),Bash(find*)"
          show_full_output: "true"
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Report QA check AI cost
        if: steps.claude-qa-fix.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ needs.triage.outputs.scratch_key }}
          EXECUTION_FILE: ${{ steps.claude-qa-fix.outputs.execution_file }}
        run: .sf-ai-tools/.github/scripts/report-ai-cost.sh || echo "::warning::cost report failed"

      - name: Evaluate and post QA report
        if: steps.claude-dev.outcome == 'success'
        uses: anthropics/claude-code-action@v1
        id: claude-qa-eval
        continue-on-error: true
        with:
          prompt: |
            Read ~/.claude/skills/qa-eval/SKILL.md for instructions.

            Evaluate results and post QA report for issue #${{ env.NUMBER }} in ${{ github.repository }}.
            Actions run URL for artifact links: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          claude_args: "--max-turns 30 --model claude-sonnet-4-6"
          additional_permissions: "Bash(git*),Bash(cp*),Bash(mkdir*)"
          show_full_output: "true"
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-screenshots
          path: /tmp/qa-screenshots/
          retention-days: 30
          if-no-files-found: ignore

      - name: Report QA eval AI cost
        if: steps.claude-qa-eval.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ needs.triage.outputs.scratch_key }}
          EXECUTION_FILE: ${{ steps.claude-qa-eval.outputs.execution_file }}
        run: .sf-ai-tools/.github/scripts/report-ai-cost.sh || echo "::warning::cost report failed"

      - name: Evaluate job outcome
        if: always()
        run: |
          if [ "${{ steps.claude-dev.outcome }}" = "failure" ]; then
            echo "::error::Dev work failed"
            exit 1
          fi
          if [ "${{ steps.claude-qa-scenarios.outcome }}" = "failure" ]; then
            echo "::warning::QA scenario generation failed (advisory — not blocking the job)"
          fi
          if [ "${{ steps.claude-qa-fix.outcome }}" = "failure" ]; then
            echo "::warning::QA check and fix failed (advisory — not blocking the job)"
          fi
          if [ "${{ steps.claude-qa-eval.outcome }}" = "failure" ]; then
            echo "::warning::QA report generation failed (advisory — not blocking the job)"
          fi

      - name: Notify on execute failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ needs.triage.outputs.number }}
          KIND: ${{ needs.triage.outputs.kind }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$KIND" = "pr" ]; then
            gh pr comment "$NUMBER" --repo ${{ github.repository }} --body "I couldn't finish — the run errored. See the [run logs]($RUN_URL). Mention me again to retry."
